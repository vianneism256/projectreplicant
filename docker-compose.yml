services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: replicant
      POSTGRES_PASSWORD: replicant
      POSTGRES_DB: replicant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
